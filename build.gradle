plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'checkstyle'
    id 'jacoco'
    id 'maven-publish'
    id 'de.undercouch.download' version '5.3.0'
}

group = 'com.ingsis'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/austral-ingsis/*")
        credentials {
            username = findProperty("gpr.user")
            password = findProperty("gpr.key")
        }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/* =======================
   New Relic
   ======================= */

tasks.register("downloadNewRelic", Download) {
    src "https://download.newrelic.com/newrelic/java-agent/newrelic-agent/current/newrelic-java.zip"
    dest file("$buildDir/newrelic/newrelic-java.zip")
}

tasks.register("unzipNewRelic", Copy) {
    dependsOn downloadNewRelic
    from zipTree("$buildDir/newrelic/newrelic-java.zip")
    into "$buildDir/newrelic"
}

bootRun {
    dependsOn unzipNewRelic
    jvmArgs = [
            "-javaagent:${buildDir}/newrelic/newrelic.jar"
    ]
}
tasks.named("bootJar") {
    dependsOn unzipNewRelic
}


/* =======================
   Tests / Coverage
   ======================= */

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy(tasks.named('jacocoTestReport'))
}

jacoco {
    toolVersion = '0.8.11'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn(tasks.test)
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

/* =======================
   Git hooks
   ======================= */

tasks.register("installGitHooks") {
    onlyIf {
        !System.getProperty("os.name").toLowerCase().contains("win")
    }
    doLast {
        exec {
            commandLine "sh", "./scripts/install-hooks.sh"
        }
    }
}

tasks.named("build") {
    dependsOn("installGitHooks")
}

/* =======================
   Quality
   ======================= */

spotless {
    java {
        target 'src/**/*.java'
        eclipse().configFile("config/eclipse-java-style.xml")
        importOrder()
        removeUnusedImports()
        lineEndings = 'UNIX'
    }
}

checkstyle {
    toolVersion = '10.12.0'
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
}

tasks.named('check') {
    dependsOn 'spotlessCheck', 'checkstyleMain', 'jacocoTestReport'
}